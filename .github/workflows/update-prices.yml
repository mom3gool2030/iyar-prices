name: تحديث أسعار عيار العقارية

on:
  schedule:
    - cron: '0 3 1,15 * *'
  workflow_dispatch:
  push:
    paths:
      - 'scraper.py'

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4

      - name: 🐍 تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 تثبيت المكتبات
        run: pip install requests beautifulsoup4

      - name: 🚀 تشغيل السكربت
        run: python scraper.py

      - name: 💾 حفظ التحديث في GitHub
        run: |
          git config user.name "Iyar Bot"
          git config user.email "bot@iyar.sa"
          git add prices.json prices.js
          git diff --staged --quiet || git commit -m "🔄 تحديث الأسعار التلقائي - $(date '+%Y-%m-%d')"
          git push
